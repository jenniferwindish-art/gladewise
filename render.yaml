# Render deployment blueprint for Bladewise.
# On render.com: New + → Blueprint → connect the repo containing this file.
# Render auto-provides PORT and RENDER_EXTERNAL_URL (used for shareable links).
services:
  - type: web
    name: bladewise
    runtime: node
    plan: free
    buildCommand: "echo no build step needed"
    startCommand: "node server.mjs"
    envVars:
      - key: NODE_VERSION
        value: "22.11.0"
